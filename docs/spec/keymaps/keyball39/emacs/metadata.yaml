platform:
  os: Windows
  layout: JIS
  notes:
    - KC_LNG1、KC_LNG2、KC_INT1、KC_INT3はJIS配列を前提とする
    - Win、Alt+F4、Alt+TabなどWindows向けショートカットを含む

layers:
  KL_BASE:
    label: Base
    purpose: 通常の文字入力
  KL_SMB:
    label: Symbols
    purpose: 記号入力と垂直スクロール
  KL_NUMFN:
    label: Num/Fn
    purpose: 左手テンキーと右手ファンクションキー
  KL_EMACS:
    label: Emacs
    purpose: Emacs形式の編集・移動操作と水平スクロール
  KL_CX:
    label: C-x
    purpose: C-x prefixに続く操作

custom_keys:
  CUT_LINE:
    label: Cut line
    description: カーソル位置から行末まで選択して切り取る
  SET_MARK:
    label: Set mark
    description: Mark選択モードの有効・無効を切り替える
  ABORT:
    label: Abort
    description: Mark中は選択モードだけを解除し、それ以外ではEscを送信する

external_shortcuts:
  - keys: Win+Shift+F23
    purpose: 外部アプリ側の割り当てに依存するショートカット（用途未記録）

workflows:
  Combo:
    - 通常入力のロール誤発火を減らすため、短い受付時間と最初の候補キーを起点とするタイマーを使う（設定値はキーマップのconfig.hを参照）
    - 後続の候補キーで受付時間を延長しない。タイマーは別の組の候補キーにも共有される
    - 押す順序は自由で、2キーを重ねて押すとクリックし、両方を離すまでボタンを保持するためドラッグできる
    - 短いクリック・連続クリック・物理修飾キーとの併用は維持するが、受付時間内のロールはクリックになり得る
    - 各レイヤーの実際のキーコードで判定する。C-x待機中も下位レイヤーへ透過するキーは従来どおりComboになり得る
  Mark:
    - Set markでキーボード内部の選択モードを切り替える（Emacs固有のコマンドは送信しない）
    - 選択モード中は矢印、Home、End、Page Up、Page Downに補助Shiftを加え、対応するアプリで範囲選択する
    - 移動キーを離すと補助Shiftを解除するが、選択モードは維持されるため連打でも選択を続けられる
    - 移動キーを重ねて押した場合は、最後の対象キーを離すまで補助Shiftを維持する
    - 物理Shiftとは独立に管理し、Markを終了しても自分で押しているShiftは解除しない
    - Markの補助にはweak右Shiftを使い、既存のShift付き記号・マクロのweak左Shiftと分離する
    - Ctrl+C、Ctrl+X、Ctrl+Vはレイヤー定義・左右の物理Ctrl・ワンショットCtrlのいずれでも選択モードを解除する（Shift併用可、Alt・GUI併用は対象外）
    - 修飾なしのC/X/Vでは選択モードを解除しない。Deleteの終了動作は従来どおり
    - Abortは選択モードとMarkの補助Shiftだけを解除し、もう一度押すとEscを送信する（画面上の選択範囲を直接消す操作ではない）
    - MarkがONでも移動キーを押していなければ文字やクリックに補助Shiftは付かないが、移動キーとの同時操作にはShiftが作用し得る
    - Win+DownなどModifier付き移動キーや、Alt+B・Alt+F・Alt+VのKey Override出力はMarkの対象に追加しない
  Macros:
    - Cut lineはShift+End、10 ms待機、Ctrl+Xの順に送信し、MarkがOFFのAbortは修飾なしのEscを送信する
    - 実行中だけ物理・補助修飾キーを外し、終了後に復元する。マウスボタンの保持状態は変更しない
    - 待機中のワンショット修飾はマクロが消費し、マクロにも次のキーにも付加しない
    - 有効中・遅延中のKey Overrideは出力前に解除する。C-xワンショットでもマクロは1回だけ実行する
    - Cut lineはMarkを終了せず、長押しリピート・行末での改行削除・kill ringへの連結は行わない
  Alt Override:
    - 左右どちらのAltでも発火し、Shiftを併用すると出力にもShiftが付く
    - Ctrl・GUIの保持中は変換しない。Ctrl・GUIを離しただけでも変換を開始しない
    - 変換中にCtrl・GUIを押すと変換を終了する。Altを先に離した場合も元の文字は再送しない
    - 対象は全レイヤーだが、各レイヤーの実際のキーコードがトリガーに一致する場合のみ発火する
  C-x:
    - EmacsレイヤーのC-xキーでワンショットのC-xレイヤーへ移動する
    - 次の1キーを処理するとC-xレイヤーを解除し、元のアクティブレイヤーへ戻る
