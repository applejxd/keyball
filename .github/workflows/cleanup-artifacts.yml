name: Cleanup artifacts

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at 00:00 UTC
  workflow_dispatch: {}

jobs:

  cleanup:
    name: Cleanup old artifacts
    runs-on: ubuntu-22.04
    permissions:
      actions: write

    steps:

    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const days = 7;
          const ms_per_day = 86400000;
          const threshold = new Date(Date.now() - days * ms_per_day);

          const artifacts = await github.paginate(
            github.rest.actions.listArtifactsForRepo,
            { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
          );

          for (const artifact of artifacts) {
            const created = new Date(artifact.created_at);
            if (created < threshold) {
              core.info(`Deleting artifact: ${artifact.name} (created: ${artifact.created_at})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
          }
