name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:

    - name: Checkout source
      uses: actions/checkout@v6

    - name: Checkout qmk_firmware
      uses: ./.github/actions/checkout-qmk_firmware
      with:
        version: ${{ inputs.qmk_version }}

    - name: Install a link to own source
      run: ln -s $(pwd)/qmk_firmware/keyboards/keyball __qmk__/keyboards/keyball

    - name: Test Keyball39 emacs
      if: inputs.keyboard == 'keyball39' && inputs.keymap == 'emacs'
      run: python3 scripts/run_keymap_tests.py --qmk-home __qmk__

    - name: Test firmware build helper
      run: python3 -B -m unittest discover -s tests -p test_build_firmware.py

    - name: Compile and link
      env:
        KEYBOARD: ${{ inputs.keyboard }}
        KEYMAP: ${{ inputs.keymap }}
      run: python3 scripts/build_firmware.py --qmk-home __qmk__ --keyboard "$KEYBOARD" --keymap "$KEYMAP"

    - name: Archive built firmware
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: build/*.hex
