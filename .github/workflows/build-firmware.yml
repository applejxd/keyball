name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Checkout qmk_firmware
      uses: ./.github/actions/checkout-qmk_firmware
      with:
        version: ${{ inputs.qmk_version }}

    - name: Install a link to own source
      run: ln -s $(pwd)/qmk_firmware/keyboards/keyball __qmk__/keyboards/keyball

    - name: Install missing python modules
      run: |
        QMK_PYTHON=$(head -1 "$(which qmk)" | sed 's/^#!\s*//' | awk '{print $1}')
        "$QMK_PYTHON" -m pip install --break-system-packages -r __qmk__/requirements.txt

    - name: Patch QMK for Python 3.14 compatibility
      run: |
        # ast.Num was removed in Python 3.14; replace with ast.Constant
        sed -i \
          -e 's/isinstance(node, ast\.Num)/isinstance(node, ast.Constant)/' \
          -e 's/return node\.n/return node.value/' \
          __qmk__/lib/python/qmk/math.py
        grep -q 'ast.Constant' __qmk__/lib/python/qmk/math.py || { echo "ERROR: math.py patch failed"; exit 1; }

    - name: Compile and link
      run: qmk compile -j 4 -kb keyball/${{ inputs.keyboard }} -km ${{ inputs.keymap }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: __qmk__/*.hex
