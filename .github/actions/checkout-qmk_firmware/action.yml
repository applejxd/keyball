name: 'Checkout QMK firmware'

inputs:
  version:
    default: '0.22.14'
    type: string
    required: false
  path:
    default: '__qmk__'
    type: string
    required: false

runs:
  using: 'composite'
  steps:

  - name: Checkout qmk_firmware
    uses: actions/checkout@v4
    with:
      path: ${{ inputs.path }}
      repository: qmk/qmk_firmware
      submodules: recursive
      ref: ${{ inputs.version }}

  - name: Setup QMK
    shell: bash
    run: |
      qmk setup --home ${{ inputs.path }} --yes

      # Install requirements into the Python that QMK actually uses
      QMK_PYTHON=$(head -1 "$(which qmk)" | sed 's/^#!\s*//' | awk '{print $1}')
      [ -x "$QMK_PYTHON" ] || { echo "ERROR: could not detect QMK Python"; exit 1; }
      "$QMK_PYTHON" -m pip install --break-system-packages -r ${{ inputs.path }}/requirements.txt

      # Patch ast.Num → ast.Constant for Python ≥3.14 compatibility (QMK ≤0.22)
      MATH_PY=${{ inputs.path }}/lib/python/qmk/math.py
      if [ -f "$MATH_PY" ] && grep -q 'ast\.Num' "$MATH_PY"; then
        sed -i \
          -e 's/isinstance(node, ast\.Num)/isinstance(node, ast.Constant)/' \
          -e 's/return node\.n/return node.value/' \
          "$MATH_PY"
      fi
